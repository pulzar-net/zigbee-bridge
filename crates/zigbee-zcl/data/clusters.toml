# Zigbee Cluster Library definitions, from the ZCL specification
# (revision 8, document 07-5123) and the Zigbee Lighting & Occupancy and
# Smart Energy specifications. build.rs turns this file into the crate's
# tables and constants; nothing is written by hand per cluster.
#
# attributes: id, name, type (a ZCL data type name), write (writable),
#   report = [min_interval_s, max_interval_s, reportable_change]: the
#   reporting configuration a host writes by default when it configures the
#   attribute (no change for discrete types).
# commands:  received by the cluster's server (client to server).
# responses: generated by the cluster's server (server to client).
#   fields = ["name:type", ...]; a trailing ? marks an optional trailing
#   field; list8<type> is a one-byte count followed by items; rest is the
#   remaining bytes.

[[cluster]]
id = 0x0000
name = "basic"
attributes = [
  { id = 0x0000, name = "zcl_version", type = "uint8" },
  { id = 0x0001, name = "application_version", type = "uint8" },
  { id = 0x0002, name = "stack_version", type = "uint8" },
  { id = 0x0003, name = "hw_version", type = "uint8" },
  { id = 0x0004, name = "manufacturer_name", type = "string" },
  { id = 0x0005, name = "model_identifier", type = "string" },
  { id = 0x0006, name = "date_code", type = "string" },
  { id = 0x0007, name = "power_source", type = "enum8" },
  { id = 0x0008, name = "generic_device_class", type = "enum8" },
  { id = 0x0009, name = "generic_device_type", type = "enum8" },
  { id = 0x000A, name = "product_code", type = "octstr" },
  { id = 0x000B, name = "product_url", type = "string" },
  { id = 0x000C, name = "manufacturer_version_details", type = "string" },
  { id = 0x000D, name = "serial_number", type = "string" },
  { id = 0x000E, name = "product_label", type = "string" },
  { id = 0x0010, name = "location_description", type = "string", write = true },
  { id = 0x0011, name = "physical_environment", type = "enum8", write = true },
  { id = 0x0012, name = "device_enabled", type = "bool", write = true },
  { id = 0x0013, name = "alarm_mask", type = "map8", write = true },
  { id = 0x0014, name = "disable_local_config", type = "map8", write = true },
  { id = 0x4000, name = "sw_build_id", type = "string" },
]
commands = [
  { id = 0x00, name = "reset_to_factory_defaults" },
]

