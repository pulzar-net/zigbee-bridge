[package]
name = "zigbee-zdo"
description = "Zigbee Device Object frames: discovery, binding and network management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zigbee-zdo"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
keywords = ["zigbee", "zdo", "iot"]
categories = ["embedded", "network-programming", "parser-implementations"]

[dependencies]
zigbee-primitives.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[features]
default = ["serde"]
## `Serialize` for descriptors and table entries.
serde = ["dep:serde", "zigbee-primitives/serde"]

[lints]
workspace = true
