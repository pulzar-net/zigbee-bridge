[package]
name = "zigbee-sim"
description = "A Zigbee network co-processor simulator (EZSP, ZNP, deCONZ) with simulated devices, for testing Zigbee hosts without hardware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zigbee-sim"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
keywords = ["zigbee", "ezsp", "znp", "simulator", "testing"]
categories = ["development-tools::testing", "simulation"]

[[bin]]
name = "zigbee-ncp-sim"
path = "src/bin/zigbee-ncp-sim.rs"

[dependencies]
zigbee-primitives.workspace = true
zigbee-ash.workspace = true
zigbee-ezsp.workspace = true
zigbee-znp.workspace = true
zigbee-deconz.workspace = true
zigbee-zcl.workspace = true
zigbee-zdo.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "io-util", "net", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true
