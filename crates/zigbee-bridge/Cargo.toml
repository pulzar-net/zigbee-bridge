[package]
name = "zigbee-bridge"
description = "A standalone Zigbee to MQTT bridge with Home Assistant discovery, on the zigbee-host stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zigbee-bridge"
readme = "README.md"
include = ["src/**", "tests/e2e.rs", "README.md", "LICENSE"]
keywords = ["zigbee", "mqtt", "home-assistant", "iot", "coordinator"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "zigbee-bridge"
path = "src/main.rs"

[features]
## Derive a JSON Schema for the configuration, from which the docs' configuration
## reference is generated (tests/config_reference.rs).
schema = ["dep:schemars"]
## Docs tooling, not API: derive JSON Schemas and AsyncAPI messages for the MQTT
## payloads (src/api.rs), from which the docs' MQTT reference is generated
## (tests/asyncapi.rs). It may change in any release; default builds, release
## binaries and cross builds never turn it on.
unstable-asyncapi-docs = ["dep:schemars", "dep:asyncapi-rust"]

[dependencies]
zigbee-primitives.workspace = true
zigbee-zcl.workspace = true
zigbee-zdo.workspace = true
zigbee-host = { workspace = true, features = ["host", "serial"] }
lexopt = "0.3"
schemars = { version = "1", optional = true, features = ["preserve_order"] }
asyncapi-rust = { version = "0.5", optional = true }
rumqttc = { version = "0.25", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
zigbee-sim.workspace = true
rumqttd = { version = "0.20", default-features = false }
tempfile = "3"

[[test]]
name = "config_reference"
required-features = ["schema"]

[[test]]
name = "asyncapi"
required-features = ["unstable-asyncapi-docs"]

[lints]
workspace = true
