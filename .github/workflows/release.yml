# A version tag (v0.1.0) publishes a GitHub release with static musl builds of
# zigbee-bridge for the gateways and x86_64, and their SHA-256 sums, and
# publishes the crates to crates.io. The tag
# must match the workspace version; CI has already tested the commit on main.
# Run it by hand with a tag to build one again with this workflow.

name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build and publish (v0.2.0)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  NIGHTLY: nightly-2026-11-14
  ZIG: 0.16.0
  ZIGBUILD: 0.24.1
  MAX_BINARY_SIZE: 4194304

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        target: [aarch64-unknown-linux-musl, mipsel-unknown-linux-musl, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: The tag matches the workspace version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "zigbee-bridge") | .version')"
          [ "v${version}" = "${TAG}" ] || { echo "tag ${TAG} is not v${version}" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@master
        timeout-minutes: 10
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rust-src
          targets: ${{ startsWith(matrix.target, 'mips') && 'x86_64-unknown-linux-gnu' || matrix.target }}
      - uses: mlugg/setup-zig@v2
        timeout-minutes: 10
        with:
          version: ${{ env.ZIG }}
      - uses: taiki-e/install-action@v2
        timeout-minutes: 10
        with:
          tool: cargo-zigbuild@${{ env.ZIGBUILD }}
      - name: Build
        env:
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=no
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          std=()
          case "${TARGET}" in mips*) std=(-Zbuild-std=std,panic_abort) ;; esac
          cargo zigbuild --release --locked --bin zigbee-bridge --target "${TARGET}" "${std[@]}"
          bin="target/${TARGET}/release/zigbee-bridge"
          file "${bin}" | grep -q 'statically linked' || { file "${bin}"; exit 1; }
          [ "$(stat -c %s "${bin}")" -le "${MAX_BINARY_SIZE}" ] || { echo "over the size budget" >&2; exit 1; }
          # Not dist/: that is the repository's packaging files.
          mkdir -p "${RUNNER_TEMP}/assets"
          cp "${bin}" "${RUNNER_TEMP}/assets/zigbee-bridge-${TAG}-${TARGET}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Release notes from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The annotated tag's message (git tag -a vX.Y.Z --cleanup=whitespace
          # -F notes.md), else GitHub's generated notes; never none.
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          git fetch -q --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          : > "${notes}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ]; then
            git cat-file tag "refs/tags/${TAG}" | sed '1,/^$/d; /^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' > "${notes}"
          fi
          if ! awk -v t="${TAG}" 'NF && $0 != t { f = 1 } END { exit !f }' "${notes}"; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" -q .body > "${notes}"
            awk 'NF && !/Full Changelog/ { f = 1 } END { exit !f }' "${notes}" || {
              echo "::error::${TAG} has no release notes: tag it with git tag -a and the notes as its message"; exit 1; }
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/assets"
          sha256sum zigbee-bridge-* > SHA256SUMS
          gh release create "${TAG}" ./* --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag

  # The crates, dependencies first; a version crates.io already has is
  # skipped, so a rerun finishes a run that stopped part way. The token is the
  # CARGO_REGISTRY_TOKEN secret until the repository variable
  # TRUSTED_PUBLISHING is "true"; then crates.io trusted publishing
  # (each crate's trusted publisher set to this repository and release.yml)
  # hands the job a short-lived token and the secret can be deleted.
  crates:
    needs: build
    runs-on: ubuntu-latest
    # A first publish of several new crates waits out crates.io's rate limit
    # on new crates.
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: vars.TRUSTED_PUBLISHING == 'true'
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: ci/publish-crates.sh
