# A version tag (v0.1.0) publishes a GitHub release with static musl builds of
# zigbee-bridge for the gateways and x86_64, and their SHA-256 sums. The tag
# must match the workspace version; CI has already tested the commit on main.

name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NIGHTLY: nightly-2026-11-14
  ZIG: 0.16.0
  ZIGBUILD: 0.24.1
  MAX_BINARY_SIZE: 4194304

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        target: [aarch64-unknown-linux-musl, mipsel-unknown-linux-musl, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the workspace version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "zigbee-bridge") | .version')"
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} is not v${version}" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@master
        timeout-minutes: 10
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rust-src
          targets: ${{ startsWith(matrix.target, 'mips') && 'x86_64-unknown-linux-gnu' || matrix.target }}
      - uses: mlugg/setup-zig@v2
        timeout-minutes: 10
        with:
          version: ${{ env.ZIG }}
      - uses: taiki-e/install-action@v2
        timeout-minutes: 10
        with:
          tool: cargo-zigbuild@${{ env.ZIGBUILD }}
      - name: Build
        env:
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=no
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          std=()
          case "${TARGET}" in mips*) std=(-Zbuild-std=std,panic_abort) ;; esac
          cargo zigbuild --release --locked --bin zigbee-bridge --target "${TARGET}" "${std[@]}"
          bin="target/${TARGET}/release/zigbee-bridge"
          file "${bin}" | grep -q 'statically linked' || { file "${bin}"; exit 1; }
          [ "$(stat -c %s "${bin}")" -le "${MAX_BINARY_SIZE}" ] || { echo "over the size budget" >&2; exit 1; }
          mkdir dist
          cp "${bin}" "dist/zigbee-bridge-${GITHUB_REF_NAME}-${TARGET}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no changelog section for ${version}" >&2; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum zigbee-bridge-* > SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
