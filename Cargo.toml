[workspace]
resolver = "2"
members = [
    "crates/zigbee-types",
    "crates/zigbee-ash",
    "crates/zigbee-ezsp",
    "crates/zigbee-znp",
    "crates/zigbee-zcl",
    "crates/zigbee-zdo",
    "crates/zigbee-host",
    "crates/zigbee-sim",
    "crates/zigbee-bridge",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pulzar-net/zigbee-bridge"
authors = ["Pulzar LLC"]

[workspace.dependencies]
zigbee-types = { path = "crates/zigbee-types", version = "0.1.0" }
zigbee-ash = { path = "crates/zigbee-ash", version = "0.1.0" }
zigbee-ezsp = { path = "crates/zigbee-ezsp", version = "0.1.0" }
zigbee-znp = { path = "crates/zigbee-znp", version = "0.1.0" }
zigbee-zcl = { path = "crates/zigbee-zcl", version = "0.1.0" }
zigbee-zdo = { path = "crates/zigbee-zdo", version = "0.1.0" }
zigbee-host = { path = "crates/zigbee-host", version = "0.1.0" }
zigbee-sim = { path = "crates/zigbee-sim", version = "0.1.0" }

aes = "0.9"
crc = "3"
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
