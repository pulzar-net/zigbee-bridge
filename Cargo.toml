[workspace]
resolver = "2"
members = [
    "crates/zigbee-primitives",
    "crates/zigbee-ash",
    "crates/zigbee-ezsp",
    "crates/zigbee-znp",
    "crates/zigbee-deconz",
    "crates/zigbee-zcl",
    "crates/zigbee-zdo",
    "crates/zigbee-host",
    "crates/zigbee-sim",
    "crates/zigbee-bridge",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/pulzar-net/zigbee-bridge"
homepage = "https://oss.pulzr.net/zigbee-bridge/"
authors = ["Pulzar LLC"]

[workspace.dependencies]
zigbee-primitives = { path = "crates/zigbee-primitives", version = "0.3.0" }
zigbee-ash = { path = "crates/zigbee-ash", version = "0.3.0" }
zigbee-ezsp = { path = "crates/zigbee-ezsp", version = "0.3.0", default-features = false }
zigbee-znp = { path = "crates/zigbee-znp", version = "0.3.0", default-features = false }
zigbee-deconz = { path = "crates/zigbee-deconz", version = "0.3.0", default-features = false }
zigbee-zcl = { path = "crates/zigbee-zcl", version = "0.3.0" }
zigbee-zdo = { path = "crates/zigbee-zdo", version = "0.3.0" }
zigbee-host = { path = "crates/zigbee-host", version = "0.3.0" }
zigbee-sim = { path = "crates/zigbee-sim", version = "0.3.0" }

aes = "0.9"
crc = "3"
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
toml = "1.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The MQTT reference (crates/zigbee-bridge/tests/asyncapi.rs, feature
# unstable-asyncapi-docs) needs what no asyncapi-rust release has yet:
# channel and operation messages (upstream main, mlilback/asyncapi-rust#17),
# and channel and operation descriptions, titles and summaries (our fork,
# offered upstream). Pinned to pulzar-net/asyncapi-rust, which is never
# published. Default and release builds never use asyncapi-rust, and
# `cargo publish` ignores this patch. Remove it once a release has all three.
[patch.crates-io]
asyncapi-rust = { git = "https://github.com/pulzar-net/asyncapi-rust", rev = "d62a75517859cc031a3f716df86e64d6406040d1" }
asyncapi-rust-codegen = { git = "https://github.com/pulzar-net/asyncapi-rust", rev = "d62a75517859cc031a3f716df86e64d6406040d1" }
asyncapi-rust-models = { git = "https://github.com/pulzar-net/asyncapi-rust", rev = "d62a75517859cc031a3f716df86e64d6406040d1" }
